{% extends 'base.html' %}{% block title %}Detalhes do funcionário{% endblock %}{% block content %}<h1>Dados do funcionário</h1><dl class="row"><dt class="col-sm-3">Nome</dt><dd class="col-sm-9">{{ fun.nome }}</dd>
<dt class="col-sm-3">CPF</dt><dd class="col-sm-9">{{ fun.cpf }}</dd>
<dt class="col-sm-3">E-mail</dt><dd class="col-sm-9">{{ fun.email }}</dd>
<dt class="col-sm-3">Remuneração</dt><dd class="col-sm-9">R$ {{ fun.remuneracao|floatformat:2 }}</dd></dl><nav><a class="btn btn-success" href="{% url 'editar_funcionario' fun.pk %}">Editar</a><a class="btn btn-outline-secondary" href="{% url 'lista_funcionarios' %}">Voltar</a></nav>{% endblock %}
