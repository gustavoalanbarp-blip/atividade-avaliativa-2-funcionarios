{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Funcionários{% endblock %} | Atividade Avaliativa 2</title>
{% bootstrap_css %}
<style>
body{background:#f4f6f9;color:#172c41;font-family:Arial,sans-serif;margin:0}
header{background:#172c41;color:white;padding:24px 5%}header p{margin:0;opacity:.8}
main{max-width:1050px;margin:35px auto;padding:28px;background:white;border-radius:12px}
h1{margin-bottom:24px;font-size:1.9rem}nav{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
td,th{padding:14px!important;vertical-align:middle} .acoes{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:700px){main{margin:15px;padding:18px}}
</style>
</head>
<body><header><strong>Gestão de funcionários</strong><p>Python · Django · MySQL</p></header>
<main>{% block content %}{% endblock %}</main>
{% bootstrap_javascript %}
</body></html>
