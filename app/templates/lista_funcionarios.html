{% extends 'base.html' %}
{% block content %}
<h1>Listagem de funcionários</h1>
<div class="table-responsive"><table class="table table-striped table-hover">
<thead><tr><th scope="col">Nome do funcionário</th><th scope="col">Ações</th></tr></thead>
<tbody>{% for funcionario in object_list %}<tr><td>{{ funcionario.nome }}</td><td><div class="acoes">
<a class="btn btn-primary btn-sm" href="{% url 'listar_funcionario' funcionario.pk %}">Exibir dados</a>
<a class="btn btn-success btn-sm" href="{% url 'editar_funcionario' funcionario.pk %}">Editar</a>
<a class="btn btn-danger btn-sm" href="{% url 'remover_funcionario' funcionario.pk %}">Remover</a>
</div></td></tr>{% empty %}<tr><td colspan="2">Nenhum funcionário cadastrado.</td></tr>{% endfor %}</tbody></table></div>
<nav><a class="btn btn-primary" href="{% url 'form_funcionario' %}">Cadastrar um novo funcionário</a></nav>
{% endblock %}
